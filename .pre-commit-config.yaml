# Pre-commit hooks mirroring .github/workflows/lint.yml (blocking checks only).
# Install: poetry run pre-commit install --install-hooks
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black
        language: system
        types: [python]

      - id: isort
        name: isort
        entry: poetry run isort
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: poetry run mypy --strict --ignore-missing-imports --disallow-untyped-defs --disallow-incomplete-defs lamd/
        language: system
        pass_filenames: false
        stages: [pre-push]
