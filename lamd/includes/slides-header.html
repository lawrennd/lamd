<script>
/* Map range slider values (min..max, often 0-based in LaMD content) to the
   1-based frame index expected by figure-animate.js showDivs(). */
function lamdFrameIndex(group) {
  var range = document.getElementById("range-" + group);
  var val = parseInt(range.value, 10);
  var min = parseInt(range.min, 10);
  return val - min + 1;
}
function lamdSetDivs(group) {
  if (typeof showDivs !== "function") return;
  slideIndex = lamdFrameIndex(group);
  showDivs(slideIndex, group);
}
function lamdPlusDivs(n, group) {
  if (typeof showDivs !== "function") return;
  var range = document.getElementById("range-" + group);
  var min = parseInt(range.min, 10);
  var max = parseInt(range.max, 10);
  var val = parseInt(range.value, 10) + n;
  if (val < min) val = max;
  if (val > max) val = min;
  range.value = val;
  range.setAttribute("aria-valuenow", val);
  slideIndex = val - min + 1;
  showDivs(slideIndex, group);
}
</script>
<script>
/* Theme chrome (logos) sits on Reveal's full-viewport .slide-background,
   which does not receive the deck transform. Sync --slide-scale so CSS can
   size that chrome with the slides (see ai-cam.css / mlatcl.css / trent.css). */
(function () {
  var bound = false;
  function syncSlideScale() {
    if (typeof Reveal === "undefined" || typeof Reveal.getScale !== "function") return false;
    try {
      var s = Reveal.getScale();
      if (!s || !isFinite(s)) return false;
      document.documentElement.style.setProperty("--slide-scale", String(s));
      return true;
    } catch (e) {
      return false;
    }
  }
  function bind() {
    if (bound) return typeof Reveal !== "undefined";
    if (typeof Reveal === "undefined" || typeof Reveal.addEventListener !== "function") return false;
    Reveal.addEventListener("ready", syncSlideScale);
    window.addEventListener("resize", function () {
      setTimeout(syncSlideScale, 0);
      setTimeout(syncSlideScale, 50);
    });
    bound = true;
    return true;
  }
  var n = 0;
  var t = setInterval(function () {
    bind();
    /* Keep polling until getScale() works — Reveal exists before initialize. */
    if (syncSlideScale() || ++n > 200) clearInterval(t);
  }, 50);
})();
</script>
