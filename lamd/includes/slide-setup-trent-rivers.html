<!--
Trent retreat theme: OSM river network ambient (CIP-0012 slide_setup).
Deck ambient behind .reveal .slides; yields to per-slide data-background* (§B3).
Data: OpenStreetMap waterways (ODbL) — Trent + major tributaries, simplified.
Set frontmatter: slide_setup: slide-setup-trent-rivers.html
-->
<style>
/* Trent brand: orange rivers on peach/white wash; navy for text */
:root {
  --trent-deep-river: #1A1A3E;
  --trent-harbor: #2a3a5c;
  --trent-orange: #F5821F;
  --trent-peach: #FDE9D8;
  --trent-cloudstone: #ffffff;
  --trent-text: #1A1A3E;
  --trent-bright: #F5821F;
}
/* Fixed viewport layer only — never touch .reveal/.slides position
   (Reveal centers via absolute + translate; relative overrides skew content). */
html.reveal-full-page,
html.reveal-full-page body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--trent-cloudstone);
}
#lamd-slide-ambient {
  position: fixed !important;
  left: 0 !important;
  top: 0 !important;
  width: 100% !important;
  height: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  display: block !important;
  z-index: 0;
  pointer-events: none;
}
#lamd-slide-ambient.lamd-ambient-paused,
#lamd-trent-logo.lamd-ambient-paused,
#lamd-trent-osm-credit.lamd-ambient-paused {
  visibility: hidden;
}
/* Let ambient show through; keep Reveal's own positioning intact */
.reveal {
  z-index: 1;
  color: var(--trent-deep-river) !important;
  background: transparent !important;
}
.reveal .slides section {
  background: transparent !important;
}
.reveal .slide-background,
.reveal .slide-background-content {
  background: transparent !important;
}
.reveal h1,
.reveal h2,
.reveal h3,
.reveal .title,
.reveal .subtitle,
.reveal .author,
.reveal .date,
.reveal .venue {
  color: var(--trent-deep-river) !important;
}
.reveal p,
.reveal li,
.reveal blockquote,
.reveal .slides,
.reveal .slide-background-content {
  color: var(--trent-deep-river) !important;
}
.reveal a {
  color: var(--trent-harbor) !important;
}
.reveal .controls,
.reveal .progress span {
  color: var(--trent-harbor);
}
#lamd-trent-logo {
  position: fixed !important;
  top: 48px;
  right: 18px;
  /* Above Reveal slide sections (z-index 11) and progress (10). */
  z-index: 20;
  pointer-events: none;
  width: 156px;
  height: auto;
  opacity: 0.92;
  line-height: 0;
}
#lamd-trent-logo svg {
  display: block;
  width: 100%;
  height: auto;
}
#lamd-trent-osm-credit {
  position: fixed !important;
  left: 12px;
  bottom: 8px;
  z-index: 2;
  pointer-events: none;
  font: 10px/1.2 system-ui, sans-serif;
  color: rgba(26, 26, 62, 0.45);
  letter-spacing: 0.02em;
}
/* Section dividers: navy→orange gradient.
   Reveal 3.x applies data-state classes to <html>, not .reveal. */
html.trent-section .reveal .slide-background.present {
  background-image: linear-gradient(135deg, #1A1A3E 0%, #2a3a5c 45%, #F5821F 100%) !important;
  background-color: transparent !important;
}
html.trent-section .reveal .slides section.present h2 {
  color: #ffffff !important;
}
</style>

          for (var s = 1; s <= steps; s++) {
            var t = s / steps;
            var u = 1 - t;
            var bx = u * u * u * p1[0] + 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * p2[0];
            var by = u * u * u * p1[1] + 3 * u * u * t * c1y + 3 * u * t * t * c2y + t * t * t * p2[1];
            pushFlat(flat, bx, by);
          }
        }
      }
      if (flat.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(flat[0][0], flat[0][1]);
      for (i = 1; i < flat.length; i++) ctx.lineTo(flat[i][0], flat[i][1]);
      ctx.strokeStyle = style;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'butt';
      ctx.lineJoin = 'bevel';
      ctx.stroke();
    }

    var a = phase.alpha;
    // Soften the main stem during unfurl so it doesn't dominate; full weight on hold.
    // Keep rivers quieter than slide text (foreground stays primary).
    var mainBoost = (phase.kind === 'unfurl') ? (0.55 + 0.45 * local) : 1;
    if (p.isMain) {
      strokeRange(2.0 * mainBoost, 'rgba(245, 130, 31, ' + (0.32 * mainBoost * a) + ')');
    } else {
      strokeRange(1.45, 'rgba(245, 130, 31, ' + (0.36 * a) + ')');
    }

    // Single tip glow on the seed-bearing path while it is still growing
    if (p.isSeedPath && local > 0.05 && local < 0.92) {
      var heads = [];
      if (lo > 1) heads.push(lo);
      if (hi < pathLen - 1) heads.push(hi);
      for (var hiHead = 0; hiHead < heads.length; hiHead++) {
        var target = heads[hiHead];
        var hx = pts[0][0], hy = pts[0][1];
        for (i = 1; i < pts.length; i++) {
          if (cum[i] >= target) {
            var seg = cum[i] - cum[i - 1];
            var f = seg > 0 ? (target - cum[i - 1]) / seg : 0;
            hx = pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f;
            hy = pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f;
            break;
          }
          hx = pts[i][0];
          hy = pts[i][1];
        }
        var glowR = 16;
        var glow = ctx.createRadialGradient(hx, hy, 0, hx, hy, glowR);
        glow.addColorStop(0, 'rgba(255, 200, 80, ' + (0.28 * a) + ')');
        glow.addColorStop(1, 'rgba(245, 130, 31, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(hx, hy, glowR, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function draw(ts) {
    if (!running) return;
    try {
      if (t0 === null) t0 = ts;
      var t = (ts - t0) / 1000;
      var w = cssW || canvas.clientWidth || window.innerWidth || 1920;
      var h = cssH || canvas.clientHeight || window.innerHeight || 1080;
      // Soft peach → white wash so orange rivers read clearly
      var g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.45, '#FDE9D8');
      g.addColorStop(1, '#fff5eb');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      var vg = ctx.createRadialGradient(w * 0.5, h * 0.45, h * 0.15, w * 0.5, h * 0.5, h * 0.9);
      vg.addColorStop(0, 'rgba(255,255,255,0)');
      vg.addColorStop(1, 'rgba(245, 130, 31, 0.03)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, w, h);

      if (!project || !paths.length) {
        raf = requestAnimationFrame(draw);
        return;
      }

      var phase = debugPhase || cyclePhase(t);
      ensureSeeds(phase.cycle);
      var i;
      for (i = 0; i < paths.length; i++) {
        if (!paths[i].isMain) strokeFeature(paths[i], w, h, phase);
      }
      for (i = 0; i < paths.length; i++) {
        if (paths[i].isMain) strokeFeature(paths[i], w, h, phase);
      }
      // Soft wipe under the logo chrome — SVG owns the confluence; canvas
      // rivers are cleared under the full wordmark so faceted chords never
      // sit beside the sharp SVG mark.
      if (logoJoinScreen && markDPx > 0) {
        var mj = logoJoinScreen(w);
        var logoLeft = w - LOGO_RIGHT - LOGO_W;
        var logoTop = LOGO_TOP;
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        // Hard clear under mark circle.
        ctx.fillStyle = 'rgba(0,0,0,1)';
        ctx.beginPath();
        ctx.arc(mj[0], mj[1], markDPx * 0.78, 0, Math.PI * 2);
        ctx.fill();
        // Soft ellipse covering mark + "trent" wordmark (+ approach zone).
        var cx = logoLeft + LOGO_W * 0.55;
        var cy = logoTop + 42;
        var wipeRx = LOGO_W * 0.88;
        var wipeRy = 72;
        var wipe = ctx.createRadialGradient(cx, cy, 8, cx, cy, wipeRx);
        wipe.addColorStop(0, 'rgba(0,0,0,0.98)');
        wipe.addColorStop(0.45, 'rgba(0,0,0,0.7)');
        wipe.addColorStop(0.8, 'rgba(0,0,0,0.2)');
        wipe.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = wipe;
        ctx.beginPath();
        ctx.ellipse(cx, cy, wipeRx, wipeRy, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      // Ember at active seed origins while unfurling
      if (phase.kind === 'unfurl' && phase.p < 0.85 && project && activeSeeds.length) {
        for (i = 0; i < activeSeeds.length; i++) {
          var sp = project(activeSeeds[i].lon, activeSeeds[i].lat, w, h);
          var er = 10 + 8 * (1 - phase.p);
          var eg = ctx.createRadialGradient(sp[0], sp[1], 0, sp[0], sp[1], er);
          eg.addColorStop(0, 'rgba(255, 200, 80, ' + (0.3 * phase.alpha) + ')');
          eg.addColorStop(1, 'rgba(245, 130, 31, 0)');
          ctx.fillStyle = eg;
          ctx.beginPath();
          ctx.arc(sp[0], sp[1], er, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    } catch (err) {
      if (typeof console !== 'undefined' && console.error) {
        console.error('lamd-trent-ambient draw failed', err);
      }
      running = false;
      raf = null;
      return;
    }

    raf = requestAnimationFrame(draw);
  }

  function startAmbient() {
    // Recover if a prior draw threw after setting running=true with no raf.
    if (running && raf === null) running = false;
    if (running || isPrintPdf()) return;
    running = true;
    t0 = null;
    debugPhase = null;
    // Debug: ?ambient=hold|early|alt freezes phase (time-independent) for screenshots.
    // early = early unfurl from SW; alt = early unfurl from NE (next cycle).
    if (window.location.search) {
      if (/[?&]ambient=hold\b/.test(window.location.search)) {
        debugPhase = { kind: 'hold', p: 1, alpha: 1, cycle: 0 };
      } else if (/[?&]ambient=early\b/.test(window.location.search)) {
        debugPhase = { kind: 'unfurl', p: 0.35, alpha: 1, cycle: 0 };
      } else if (/[?&]ambient=alt\b/.test(window.location.search)) {
        debugPhase = { kind: 'unfurl', p: 0.35, alpha: 1, cycle: 1 };
      }
    }
    raf = requestAnimationFrame(draw);
  }

  function pauseAmbient() {
    running = false;
    if (raf !== null) {
      cancelAnimationFrame(raf);
      raf = null;
    }
  }

  var cssW = 0;
  var cssH = 0;

  function resizeCanvas() {
    var w = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1920);
    var h = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1080);
    // Headless / some displays report dpr=1; keep ≥2 so estuary curves stay sharp.
    var dpr = Math.min(Math.max(window.devicePixelRatio || 1, 2), 3);
    cssW = w;
    cssH = h;
    var bw = Math.round(w * dpr);
    var bh = Math.round(h * dpr);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
    }
    // Draw in CSS pixels; backing store is retina-scaled.
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function mountAmbient() {
    if (!canvas.parentNode) {
      document.body.insertBefore(canvas, document.body.firstChild);
    }
    if (!logo.parentNode) {
      document.body.appendChild(logo);
    }
    if (!credit.parentNode) {
      document.body.appendChild(credit);
    }
    resizeCanvas();
  }

  function onReady() {
    mountAmbient();
    buildPaths();
    var slide = (typeof Reveal !== 'undefined' && Reveal.getCurrentSlide)
      ? Reveal.getCurrentSlide()
      : null;
    syncAmbientToSlide(slide);
    // Re-center after ambient mount (guards against any first-paint layout jitter).
    if (typeof Reveal !== 'undefined' && typeof Reveal.layout === 'function') {
      Reveal.layout();
    }
  }

  window.addEventListener('resize', function () {
    resizeCanvas();
    if (typeof Reveal !== 'undefined' && typeof Reveal.layout === 'function') {
      Reveal.layout();
    }
  });

  if (typeof Reveal !== 'undefined' && Reveal.addEventListener) {
    Reveal.addEventListener('ready', onReady);
    Reveal.addEventListener('slidechanged', function (e) {
      syncAmbientToSlide(e.currentSlide);
    });
    // Initialize may already have fired 'ready' before this include runs.
    if (Reveal.isReady && Reveal.isReady()) {
      onReady();
    }
  } else {
    document.addEventListener('DOMContentLoaded', onReady);
  }
})();
</script>
